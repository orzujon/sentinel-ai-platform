---
# Approved Stage 4.3.2 package installation ONLY. No init/join or network changes.
- name: Preflight BOTH guests before any package changes
  hosts: sentinel_sandbox
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require controller approval
      ansible.builtin.assert:
        that:
          - sentinel_k8s_install_approved is defined
          - sentinel_k8s_install_approved is sameas true
          - sentinel_k8s_version == '1.37.2-1.1'
    - name: Require reviewed exact signed repository source
      ansible.builtin.command: cat /etc/apt/sources.list.d/kubernetes.list
      changed_when: false
      register: source
    - name: Check source
      ansible.builtin.assert:
        that:
          - source.stdout == 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /'
    - name: Verify signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --batch, --show-keys, --with-colons, /etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      changed_when: false
      register: key
    - name: Assert signing identity unchanged
      ansible.builtin.assert:
        that:
          - "key.stdout is search('(?m)^fpr:::::::::DE15B14486CD377B9E876E1A234654DA9A296436:')"
    - name: Check exact package candidate origin
      ansible.builtin.command:
        argv: [apt-cache, policy, "{{ item }}"]
      loop: [kubeadm, kubelet, kubectl]
      changed_when: false
      register: policies
    - name: Assert exact signed candidate exists
      ansible.builtin.assert:
        that:
          - "item.stdout is search('Candidate: 1[.]37[.]2-1[.]1')"
          - "item.stdout is search('pkgs[.]k8s[.]io/core:/stable:/v1[.]37/deb/')"
      loop: "{{ policies.results }}"
    - name: Check package state
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}", "{{ item }}"]
      loop: [kubeadm, kubelet, kubectl]
      register: already
      changed_when: false
      failed_when: false
    - name: Require first-install state only
      ansible.builtin.assert:
        that:
          - already.results | map(attribute='rc') | list == [1, 1, 1]
    - name: Simulate pinned installation
      become: true
      ansible.builtin.command:
        argv: [apt-get, -s, install, --no-install-recommends, "kubeadm=1.37.2-1.1", "kubelet=1.37.2-1.1", "kubectl=1.37.2-1.1"]
      changed_when: false
      register: simulation
    - name: Forbid unexpected removal in simulation
      ansible.builtin.assert:
        that:
          - "simulation.stdout is not search('(?m)^Rem ')"
          - "simulation.stdout is search('(?m)^Inst kubeadm ')"
          - "simulation.stdout is search('(?m)^Inst kubelet ')"
          - "simulation.stdout is search('(?m)^Inst kubectl ')"
- name: Install pinned packages one sandbox guest at a time
  hosts: sentinel_sandbox
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Install reviewed exact Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubeadm=1.37.2-1.1
          - kubelet=1.37.2-1.1
          - kubectl=1.37.2-1.1
        state: present
        install_recommends: false
        allow_downgrade: false
    - name: Hold Kubernetes packages to prevent unintended upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]
    - name: Verify installed version
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Version}", "{{ item }}"]
      loop: [kubeadm, kubelet, kubectl]
      register: versions
      changed_when: false
    - name: Assert pinned version on all packages
      ansible.builtin.assert:
        that:
          - versions.results | map(attribute='stdout') | unique | list == ['1.37.2-1.1']
    - name: Verify package holds
      ansible.builtin.command: apt-mark showhold
      register: holds
      changed_when: false
    - name: Assert holds applied
      ansible.builtin.assert:
        that:
          - "'kubeadm' in holds.stdout_lines"
          - "'kubelet' in holds.stdout_lines"
          - "'kubectl' in holds.stdout_lines"
