name: Sentinel Terraform static safety

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - name: Check Terraform source formatting
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate all four roots without backend initialization or cluster access
        shell: bash
        run: |
          set -euo pipefail
          for root in infrastructure/terraform/environments/level1/*/; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows state and cluster preflight scripts without execution
        shell: powershell
        run: |
          $scripts = @(
            'infrastructure/terraform/scripts/Initialize-SentinelTerraformState.ps1',
            'infrastructure/terraform/scripts/Test-SentinelTerraformTarget.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count -ne 0) { throw "PowerShell parser errors in $script" }
          }
