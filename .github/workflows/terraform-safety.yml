name: Sentinel Terraform static safety

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - name: Check Terraform source formatting
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate all four roots without backend initialization or cluster access
        shell: bash
        run: |
          set -euo pipefail
          for root in infrastructure/terraform/environments/level1/*/; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done
