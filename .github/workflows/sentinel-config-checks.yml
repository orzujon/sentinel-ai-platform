name: Sentinel infrastructure configuration safety
on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/sentinel-config-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only YAML parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Execute config safety tests
        run: python -m unittest discover -s infrastructure/config/tests -p 'test_*.py' -v
      - name: Execute Stage 4 private inventory contract tests
        run: python -m unittest discover -s infrastructure/ansible/tests -p 'test_*.py' -v
      - name: Install Ansible for playbook syntax gate
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Validate non-mutating Stage 4 playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/00-readiness.yml
      - name: Validate approved fresh-only KVP package installation syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/36-hyperv-kvp-package-apply.yml
      - name: Validate fresh-only Hyper-V KVP package preflight syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/35-hyperv-kvp-package-plan.yml
      - name: Validate read-only Stage 4.2 discovery playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/10-baseline-discovery.yml
      - name: Validate gated Stage 4.2 containerd apply playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/20-containerd-baseline.yml
      - name: Validate Stage 4.2 sandbox reboot persistence playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/30-reboot-persistence.yml
      - name: Validate Stage 4.3.1 read-only Kubernetes discovery playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/40-kubernetes-discovery.yml
      - name: Validate read-only Stage 4.3.2 source plan playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/50-kubernetes-package-source-plan.yml
      - name: Validate Stage 4.3.2 approval gated signed APT source playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/60-kubernetes-repository.yml
      - name: Validate Stage 4.3.2 installation plan syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/70-kubernetes-install-plan.yml
      - name: Validate Stage 4.3.2 approval-gated install syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/80-kubernetes-package-install.yml
      - name: Validate Stage 4.3.3 guarded control-plane initialization syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/90-kubeadm-control-plane.yml
      - name: Validate Stage 4.3.4 read-only Flannel plan syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/100-flannel-release-plan.yml
      - name: Validate Stage 4.3.4 approval-gated Flannel apply syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/110-flannel-release-apply.yml
      - name: Validate desired-state reconciliation syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/120-reconcile-flannel.yml
      - name: Validate Stage 4.3.5 worker reconciliation playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/130-reconcile-worker.yml
      - name: Validate Stage 4.4 read-only cluster acceptance playbook
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/140-cluster-validate.yml
      - name: Validate Stage 4.4.1 approved active networking playbook
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/150-active-network.yml
      - name: Compile Python management runner
        run: python -m py_compile infrastructure/ansible/run_readiness.py infrastructure/ansible/reconcile.py
      - name: Test exact disposable KVP five-package transaction gate
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_worker_replica_kvp_simulation.py' -v
      - name: Test matching-kernel KVP recovery simulation and fail-closed limits
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_worker_replica_kvp_kernel_recovery.py' -v
      - name: Test disposable KVP guest-to-host SSH public key publisher
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_worker_replica_kvp_publisher.py' -v
      - name: Verify fresh firstboot KVP shell script syntax
        run: bash -n infrastructure/level1/src/firstboot-kvp-setup.sh
      - name: Test Stage54 self-contained firstboot KVP publisher
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_firstboot_kvp.py' -v
      - name: Execute Level 1 static package tests
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_*.py' -v
      - name: Demonstrate read-only sample plan
        run: python infrastructure/config/plan.py --config-file infrastructure/config/fixtures/lab.example.yaml --environment lab

  windows-static-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise cross-platform guest KVP publisher offline tests on Windows
        shell: powershell
        run: python -m unittest discover -s infrastructure/ansible/tests -p 'test_publish_guest_kvp_hostkey.py' -v
      - name: Validate Stage 4 Windows-to-WSL entrypoint syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/infrastructure/ansible/Invoke-SentinelReadiness.ps1",
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Stage 4 entrypoint has parser errors" }
      - name: Exercise Stage 4.2 mode and approval gates (without any VM connections)
        shell: powershell
        run: .\\infrastructure\\ansible\\tests\\Test-ModeApprovalGate.ps1
      - name: Verify native stderr warning logging and true process failure detection
        shell: powershell
        run: .\infrastructure\ansible\tests\Test-NativeStderrCapture.ps1
      - name: Test Stage 5 bootstrap route classification without Hyper-V
        shell: powershell
        run: .\infrastructure\level1\tests\Test-BootstrapPlan.ps1
      - name: Verify Stage 5.2 read-only existing-environment orchestration contract
        shell: powershell
        run: .\infrastructure\level1\tests\Test-BootstrapVerify.ps1
      - name: Parse read-only Hyper-V guest KVP discovery script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/infrastructure/level1/tools/Inspect-SentinelHyperVKvp.ps1",
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Hyper-V KVP discovery script parser errors" }
          $source = Get-Content infrastructure/level1/tools/Inspect-SentinelHyperVKvp.ps1 -Raw
          foreach ($forbidden in @('Set-VM', 'Stop-VM', 'Remove-VM', 'Set-VMIntegrationService', 'ssh-keyscan', 'accept-new')) {
            if ($source -match ([regex]::Escape($forbidden) + '\\s')) { throw "Forbidden mutation or trust-on-first-use primitive: $forbidden" }
          }
      - name: Validate Windows-to-WSL path conversion without launching a VM
        shell: powershell
        run: |
          $path = 'infrastructure/level1/src/Sentinel.WslPaths.psm1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD $path), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw 'WSL path module parser errors' }
          .\infrastructure\level1\tests\Test-WslPaths.ps1
      - name: Verify exact-ID single-disposable cleanup and fail-closed approval
        shell: powershell
        run: .\infrastructure\level1\tests\Test-DisposableCleanup.ps1
      - name: Validate guarded worker replica KVP plan/apply approval and isolation
        shell: powershell
        run: .\infrastructure\level1\tests\Test-WorkerReplicaKvp.ps1
      - name: Validate KVP host identity publication and VM-bound collector
        shell: powershell
        run: .\infrastructure\level1\tests\Test-WorkerReplicaKvpIdentity.ps1
      - name: Validate KVP-pinned SSH trust registration and Windows ACL protection
        shell: powershell
        run: .\infrastructure\level1\tests\Test-WorkerReplicaSshTrust.ps1
      - name: Verify reusable Stage54 no-TOFU fresh VM to Ansible bootstrap contract
        shell: powershell
        run: .\infrastructure\level1\tests\Test-Stage54.ps1
      - name: Verify worker-shaped two-NIC disposable VM and safety contracts offline
        shell: powershell
        run: .\infrastructure\level1\tests\Test-WorkerReplicaContract.ps1
      - name: Validate disposable VM provisioner syntax and isolation contract
        shell: powershell
        run: |
          $path = 'infrastructure/level1/tools/New-SentinelDisposableE2E.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD $path), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw 'Disposable provisioner parser errors' }
          $src = Get-Content $path -Raw
          foreach ($required in @(
            'CREATE_DISPOSABLE_SENTINEL_E2E_SSH01',
            'sentinel-e2e-ssh01',
            'Test-SentinelDisposableE2E.ps1',
            'Get-FileHash',
            'C:\Sentinel\E2E-Disposable',
            'Default Switch',
            'PLAN'
          )) {
            if (-not $src.Contains($required)) { throw "Provisioner is missing safety contract: $required" }
          }
          foreach ($forbidden in @('Remove-VM','Stop-VM','Remove-VMSwitch','ssh-keyscan','StrictHostKeyChecking=accept-new')) {
            if ($src -match ('(?m)^\s*' + [regex]::Escape($forbidden) + '\\b')) {
              throw "Unexpected destructive or insecure operation: $forbidden"
            }
          }
      - name: Parse and statically guard disposable E2E preflight
        shell: powershell
        run: |
          $path = "infrastructure/level1/tools/Test-SentinelDisposableE2E.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD $path), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Disposable E2E preflight parser errors" }
          $source = Get-Content $path -Raw
          foreach ($forbidden in @('New-VM', 'Remove-VM', 'Stop-VM', 'Start-VM', 'New-VMSwitch', 'Remove-VMSwitch', 'Set-VM')) {
            if ($source -match ('(?m)^\s*' + [regex]::Escape($forbidden) + '\\b')) { throw "Unexpected mutation command: $forbidden" }
          }
          if ($source -notmatch 'sentinel-e2e-ssh01' -or $source -notmatch 'ExistingProtectedVMs') {
            throw "Missing disposable name and protected VM safeguards"
          }
      - name: Validate Stage 5.3 host-side KVP collector and VM-bound evidence offline
        shell: powershell
        run: |
          $files = @(
            'infrastructure/level1/src/Sentinel.KvpEvidence.psm1',
            'infrastructure/level1/tools/Read-SentinelKvpIdentity.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "Parser errors in $file" }
          }
          .\infrastructure\level1\tests\Test-KvpEvidence.ps1
      - name: Validate Stage 5.3 fresh bootstrap dependency and safety contract
        shell: powershell
        run: .\infrastructure\level1\tests\Test-FreshBootstrapContract.ps1
      - name: Parse all Level 1 PowerShell modules and verify isolation checks
        shell: powershell
        run: .\infrastructure\level1\tests\Test-StaticSafety.ps1
