name: Sentinel infrastructure configuration safety
on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/sentinel-config-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only YAML parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Execute config safety tests
        run: python -m unittest discover -s infrastructure/config/tests -p 'test_*.py' -v
      - name: Execute Stage 4 private inventory contract tests
        run: python -m unittest discover -s infrastructure/ansible/tests -p 'test_*.py' -v
      - name: Install Ansible for playbook syntax gate
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Validate non-mutating Stage 4 playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/00-readiness.yml
      - name: Validate read-only Stage 4.2 discovery playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/10-baseline-discovery.yml
      - name: Validate gated Stage 4.2 containerd apply playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/20-containerd-baseline.yml
      - name: Validate Stage 4.2 sandbox reboot persistence playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/30-reboot-persistence.yml
      - name: Validate Stage 4.3.1 read-only Kubernetes discovery playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/40-kubernetes-discovery.yml
      - name: Validate read-only Stage 4.3.2 source plan playbook syntax
        run: ansible-playbook --syntax-check infrastructure/ansible/playbooks/50-kubernetes-package-source-plan.yml
      - name: Execute Level 1 static package tests
        run: python -m unittest discover -s infrastructure/level1/tests -p 'test_*.py' -v
      - name: Demonstrate read-only sample plan
        run: python infrastructure/config/plan.py --config-file infrastructure/config/fixtures/lab.example.yaml --environment lab

  windows-static-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Stage 4 Windows-to-WSL entrypoint syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/infrastructure/ansible/Invoke-SentinelReadiness.ps1",
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Stage 4 entrypoint has parser errors" }
      - name: Exercise Stage 4.2 mode and approval gates (without any VM connections)
        shell: powershell
        run: .\\infrastructure\\ansible\\tests\\Test-ModeApprovalGate.ps1
      - name: Parse all Level 1 PowerShell modules and verify isolation checks
        shell: powershell
        run: .\infrastructure\level1\tests\Test-StaticSafety.ps1
