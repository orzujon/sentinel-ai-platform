name: Sentinel API checks

on:
  push:
    paths:
      - "api/**"
      - "knowledge/**"
      - "compose.yaml"
      - ".github/workflows/api-checks.yml"
  pull_request:
    paths:
      - "api/**"
      - "knowledge/**"
      - "compose.yaml"
      - ".github/workflows/api-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Validate Compose configuration without starting services
        run: docker compose -f compose.yaml config --quiet
      - name: Validate API container build includes runbooks
        run: docker build -f api/Dockerfile -t sentinel-api:ci .
      - name: Verify Python syntax
        run: python -m compileall -q api
      - name: Test API without Ollama or GPU
        run: python -m pytest api/tests -q
